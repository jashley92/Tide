name: Nightly performance

# Tier 2 and Tier 3 of the performance budget (docs/development/testing.md, "Nightly performance"): timings of the hot
# pages on SQLite at twice the scale harness's data, and SQL Server's logical reads for the same pages. Nightly on main,
# by hand, or on a pull request labelled `perf`; never a gate on every PR (the per-PR query budget is). A timing over its
# budget is a warning in the summary; over twice it, and logical reads over their baseline by a quarter, fail the run.
on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC: after the US day's merges, before Europe's
  workflow_dispatch:
  pull_request:
    types: [ labeled, synchronize ]

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  timings:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Timings (Tier 2)
        env:
          TIDE_PERF: '1'
          TIDE_PERF_OUT: ${{ runner.temp }}/perf.md
        run: |
          dotnet build tests/Tide.IntegrationTests -c Release -nologo
          set +e
          dotnet test tests/Tide.IntegrationTests -c Release --no-build --filter "FullyQualifiedName~NightlyPerfTests.Timings" \
            --logger "console;verbosity=normal"
          code=$?
          [ -f "$TIDE_PERF_OUT" ] && cat "$TIDE_PERF_OUT" >> "$GITHUB_STEP_SUMMARY"
          exit $code

  logical-reads:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SA_PASSWORD: Tide!${{ github.run_id }}x   # throwaway container; not a secret
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Tide!${{ github.run_id }}x
        ports: [ '1433:1433' ]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Tide!${{ github.run_id }}x' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Logical reads (Tier 3)
        env:
          TIDE_PERF: '1'
          TIDE_PERF_OUT: ${{ runner.temp }}/perf.md
          TIDE_TEST_SQL: Server=localhost,1433;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False
        run: |
          dotnet build tests/Tide.IntegrationTests -c Release -nologo
          set +e
          dotnet test tests/Tide.IntegrationTests -c Release --no-build --filter "FullyQualifiedName~NightlyPerfTests.LogicalReads" \
            --logger "console;verbosity=normal"
          code=$?
          [ -f "$TIDE_PERF_OUT" ] && cat "$TIDE_PERF_OUT" >> "$GITHUB_STEP_SUMMARY"
          exit $code
